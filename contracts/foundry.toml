[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Halves the bytecode; without it the deployment exceeds Sepolia's
# per-transaction gas cap under the current state-creation pricing.
optimizer = true
optimizer_runs = 200

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
